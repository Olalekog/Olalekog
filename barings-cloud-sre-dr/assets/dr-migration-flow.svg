<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>.title{font:700 28px Arial;fill:#172033}.step{fill:#f8fafc;stroke:#475467;stroke-width:2;rx:14}.test{fill:#eef4ff;stroke:#2e5aac;stroke-width:2;rx:14}.done{fill:#ecfdf3;stroke:#027a48;stroke-width:2;rx:14}.txt{font:600 15px Arial;fill:#172033}.small{font:13px Arial;fill:#475467}.line{stroke:#475467;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475467"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#fff"/>
  <text x="50" y="55" class="title">DR Migration Execution Flow</text>
  <g transform="translate(50 110)"><rect width="190" height="90" class="step"/><text x="20" y="38" class="txt">1. Assess</text><text x="20" y="63" class="small">Current DR state</text></g>
  <g transform="translate(290 110)"><rect width="190" height="90" class="step"/><text x="20" y="38" class="txt">2. Map</text><text x="20" y="63" class="small">Dependencies</text></g>
  <g transform="translate(530 110)"><rect width="190" height="90" class="step"/><text x="20" y="38" class="txt">3. Confirm</text><text x="20" y="63" class="small">RTO and RPO</text></g>
  <g transform="translate(770 110)"><rect width="190" height="90" class="step"/><text x="20" y="38" class="txt">4. Validate</text><text x="20" y="63" class="small">Backup / replication</text></g>
  <g transform="translate(1010 110)"><rect width="140" height="90" class="test"/><text x="18" y="38" class="txt">5. Build</text><text x="18" y="63" class="small">Target DR</text></g>
  <path d="M240 155 H290" class="line"/><path d="M480 155 H530" class="line"/><path d="M720 155 H770" class="line"/><path d="M960 155 H1010" class="line"/>
  <g transform="translate(50 300)"><rect width="190" height="90" class="test"/><text x="20" y="38" class="txt">6. Migrate</text><text x="20" y="63" class="small">Execute runbook</text></g>
  <g transform="translate(290 300)"><rect width="190" height="90" class="test"/><text x="20" y="38" class="txt">7. Test</text><text x="20" y="63" class="small">Restore / failover</text></g>
  <g transform="translate(530 300)"><rect width="190" height="90" class="test"/><text x="20" y="38" class="txt">8. Validate</text><text x="20" y="63" class="small">Application health</text></g>
  <g transform="translate(770 300)"><rect width="190" height="90" class="done"/><text x="20" y="38" class="txt">9. Document</text><text x="20" y="63" class="small">Results and gaps</text></g>
  <g transform="translate(1010 300)"><rect width="140" height="90" class="done"/><text x="18" y="38" class="txt">10. Handoff</text><text x="18" y="63" class="small">Cloud Ops</text></g>
  <path d="M1080 200 V255 H145 V300" class="line"/><path d="M240 345 H290" class="line"/><path d="M480 345 H530" class="line"/><path d="M720 345 H770" class="line"/><path d="M960 345 H1010" class="line"/>
</svg>
