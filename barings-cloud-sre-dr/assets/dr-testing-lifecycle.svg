<svg width="1000" height="760" viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>.title{font:700 28px Arial;fill:#172033}.node{fill:#f8fafc;stroke:#475467;stroke-width:2;rx:18}.active{fill:#eef4ff;stroke:#2e5aac;stroke-width:2;rx:18}.final{fill:#ecfdf3;stroke:#027a48;stroke-width:2;rx:18}.txt{font:600 16px Arial;fill:#172033}.small{font:13px Arial;fill:#475467}.line{stroke:#475467;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475467"/></marker>
  </defs>
  <rect width="1000" height="760" fill="#fff"/>
  <text x="60" y="58" class="title">DR Testing Lifecycle</text>
  <circle cx="500" cy="390" r="250" fill="#f8fafc" stroke="#e4e7ec" stroke-width="2"/>
  <g transform="translate(390 95)"><rect width="220" height="78" class="node"/><text x="30" y="32" class="txt">1. Define Scope</text><text x="30" y="56" class="small">Apps and test objectives</text></g>
  <g transform="translate(675 220)"><rect width="220" height="78" class="node"/><text x="30" y="32" class="txt">2. Confirm RTO/RPO</text><text x="30" y="56" class="small">Business recovery targets</text></g>
  <g transform="translate(675 475)"><rect width="220" height="78" class="active"/><text x="30" y="32" class="txt">3. Execute Recovery</text><text x="30" y="56" class="small">Restore or failover</text></g>
  <g transform="translate(390 600)"><rect width="220" height="78" class="active"/><text x="30" y="32" class="txt">4. Validate Health</text><text x="30" y="56" class="small">Application and data checks</text></g>
  <g transform="translate(105 475)"><rect width="220" height="78" class="final"/><text x="30" y="32" class="txt">5. Measure Results</text><text x="30" y="56" class="small">Actual RTO and RPO</text></g>
  <g transform="translate(105 220)"><rect width="220" height="78" class="final"/><text x="30" y="32" class="txt">6. Improve</text><text x="30" y="56" class="small">Remediate and update runbooks</text></g>
