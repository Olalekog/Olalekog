<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title{font:700 28px Arial;fill:#172033}.label{font:600 17px Arial;fill:#172033}.small{font:14px Arial;fill:#344054}.box{fill:#f8fafc;stroke:#475467;stroke-width:2;rx:14}.cloud{fill:#eef4ff;stroke:#2e5aac;stroke-width:2;rx:20}.ops{fill:#ecfdf3;stroke:#027a48;stroke-width:2;rx:14}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:14}.line{stroke:#475467;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#475467;stroke-width:2;fill:none;stroke-dasharray:8 6;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475467"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="60" y="58" class="title">High-Level Disaster Recovery Architecture</text>
  <rect x="60" y="110" width="310" height="230" class="box"/>
  <text x="90" y="150" class="label">Primary Production</text>
  <text x="90" y="185" class="small">US-hosted applications</text>
  <text x="90" y="215" class="small">Databases</text>
  <text x="90" y="245" class="small">Market data services</text>
  <text x="90" y="275" class="small">Current operational workloads</text>
  <rect x="830" y="110" width="310" height="230" class="cloud"/>
  <text x="860" y="150" class="label">Cloud / Hybrid DR</text>
