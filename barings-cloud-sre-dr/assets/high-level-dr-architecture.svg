  <path d="M745 175 H830" class="line"/><path d="M745 295 H830" class="line"/>
  <path d="M215 340 V430" class="line"/><path d="M595 335 V430" class="line"/><path d="M985 340 V430" class="line"/>
  <path d="M370 520 H445" class="line"/><path d="M745 520 H830" class="line"/>
